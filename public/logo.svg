<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular verde -->
  <circle cx="60" cy="60" r="58" fill="#16a34a" stroke="#15803d" stroke-width="2"/>

  <!-- Bandas decorativas -->
  <path d="M10 60 Q60 30 110 60" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M10 65 Q60 95 110 65" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Balón de fútbol estilizado -->
  <circle cx="60" cy="55" r="28" fill="#ffffff" stroke="#15803d" stroke-width="2"/>

  <!-- Pentágono central del balón -->
  <polygon points="60,42 70,49 66,60 54,60 50,49" fill="#15803d"/>

  <!-- Pentágonos laterales -->
  <polygon points="60,42 50,30 40,38 50,49" fill="#15803d" opacity="0.9"/>
  <polygon points="60,42 70,30 80,38 70,49" fill="#15803d" opacity="0.9"/>
  <polygon points="54,60 40,68 50,80 60,72" fill="#15803d" opacity="0.9"/>
  <polygon points="66,60 80,68 70,80 60,72" fill="#15803d" opacity="0.9"/>

  <!-- Texto "FUTAPP" -->
  <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">FUTAPP</text>
</svg>
